# Dev:  docker compose up -d db          (only Postgres; run api/web locally with hot reload)
# Demo: docker compose up -d --build     (db + api + web, open http://localhost:8080)
name: spk-bansos

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-spk_bansos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-spk}:${POSTGRES_PASSWORD:-spk_dev_password}@db:5432/${POSTGRES_DB:-spk_bansos}?schema=public
      UPLOAD_DIR: /app/uploads
      # From .env; the api refuses to start in production without it
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    build: ${WEB_PATH:-../../Frontend/spk-bansos-web}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
